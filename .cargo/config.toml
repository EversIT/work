[build]
target-dir = 'dist/target'

# Lets CI cross-compile aarch64 container images for the Rust apps from the same amd64
# GitHub Actions runner (see publish.yml's "Install aarch64 cross-compilation toolchain"
# step). Harmless on a host that never builds for this target.
[target.aarch64-unknown-linux-gnu]
linker = 'aarch64-linux-gnu-gcc'
