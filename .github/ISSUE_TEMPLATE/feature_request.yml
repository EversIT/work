name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How could it work? Sketches and examples (for instance from Jira) are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options: ['Yes, with some guidance', 'Maybe later', 'No']
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and did not find this.
          required: true
