name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Security problems do not belong here**: use *Security → Report a vulnerability*
        (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From the admin panel (Overview → Configuration → Version), the image tag, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        [
          Frontend,
          Backend / API,
          Sign-in (password,
          passkeys,
          SSO),
          Automations,
          Files / storage,
          Deployment / Docker,
          Documentation,
          Not sure,
        ]
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run it?
      options:
        [Docker compose, Container images in Kubernetes, From source, Other]
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Logs and errors
      description: Browser console and backend log lines around the problem. **Remove secrets, tokens and personal data first.**
      render: text
