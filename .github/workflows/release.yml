name: release

# One click from main to a published version: `nx release` works out the next version from the
# conventional commits since the last tag (or takes the one you give), bumps package.json, writes
# CHANGELOG.md, commits, tags `vX.Y.Z`, pushes and creates the GitHub release. The publish workflow
# is then called with that tag and pushes the images tagged X.Y.Z, X.Y, X and latest.
#
# The push to main needs the Actions bot to be allowed to bypass branch protection (or use a
# deploy key / app token in place of GITHUB_TOKEN).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'auto (from commits), patch, minor, major, or an exact version like 1.2.0'
        type: string
        default: auto
      first_release:
        description: 'Nothing has been tagged yet'
        type: boolean
        default: false

run-name: Release (${{ inputs.version }})

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog, tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Commit as the Actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: nx release
        env:
          VERSION: ${{ inputs.version }}
          FIRST_RELEASE: ${{ inputs.first_release }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--yes --skip-publish)
          if [ -n "$VERSION" ] && [ "$VERSION" != "auto" ]; then args+=(--specifier "$VERSION"); fi
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          npx nx release "${args[@]}"

      - name: Find the new tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish images
    needs: release
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
