name: Security and tests
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ${{ github.run_id }}-ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://ci:${{ github.run_id }}-ci@localhost:5432/ci
      TEST_SMTP_PORT: '1025'
      TEST_MAILPIT_API: http://127.0.0.1:8025
      TEST_S3_ENDPOINT: http://127.0.0.1:9090
      TEST_S3_BUCKET: work-test
      TEST_AZURE_ENDPOINT: http://127.0.0.1:10000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - name: Start storage emulators (S3 and Azure Blob) with a throw-away key
        run: |
          AZURE_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$AZURE_KEY"
          echo "TEST_AZURE_ACCESS_KEY=$AZURE_KEY" >> "$GITHUB_ENV"
          docker run -d -p 9090:9090 -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=work-test adobe/s3mock
          docker run -d -p 10000:10000 -e "AZURITE_ACCOUNTS=work:$AZURE_KEY" mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          sleep 8
      - run: rustup show
      # `.cargo/config.toml` puts the build output in dist/target; the cache must look there, or every
      # run compiles all ~400 crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist/target'
      - run: npm ci --ignore-scripts
      # Includes the #[ignore]d end-to-end tests that need the Postgres service above.
      - run: npx nx run backend:test --args=--include-ignored
      # The committed spec must match the code, so API changes are always reviewed. (The frontend
      # builds its client from this file and needs no Rust.)
      - run: npx nx run backend:openapi
      - run: git diff --exit-code apps/backend/openapi.json
  # Formatting and clippy run next to the tests instead of before them: they need their own compile
  # (check metadata, not code), so in one job the times add up; as separate jobs they overlap.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist/target'
      - run: npm ci --ignore-scripts
      - run: cargo fmt --all -- --check
      - run: npx nx run backend:lint
  # Reads Cargo.lock only; nothing is compiled, so it needs neither the Rust cache nor Node.
  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A prebuilt binary: `cargo install` compiled cargo-audit from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npx nx run frontend:build
  e2e:
    # Production images through the compose file, then the browser tests against http://localhost:3000.
    runs-on: ubuntu-latest
    needs: [backend, backend-lint, backend-audit, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: rustup show
      # `.cargo/config.toml` puts the build output in dist/target; the cache must look there, or every
      # run compiles all ~400 crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist/target'
      - run: npm ci --ignore-scripts
      # The container plugin detects GitHub Actions and asks for the workflow's token (it only reads
      # repository metadata for the image labels); the publish workflow passes it the same way.
      - run: npx nx run-many -t container:local
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the stack with throw-away secrets
        run: |
          {
            echo "WORK_FRONTEND_IMAGE=work-frontend:latest"
            echo "WORK_BACKEND_IMAGE=work-backend:latest"
            echo "POSTGRES_USER=work"
            echo "POSTGRES_DB=work"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "WORK_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "WORK_FRONTEND_URL=http://localhost:3000"
            echo "WORK_AUTH_RATE_LIMIT=1000"
            echo "WORK_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "WORK_SMTP_HOST=mailpit"
            echo "WORK_SMTP_PORT=1025"
            echo "WORK_SMTP_FROM=work@example.test"
            echo "WORK_SMTP_TLS=none"
          } > "$RUNNER_TEMP/stack.env"
          docker compose -f packages/deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" --profile dev up -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=apps/frontend-e2e/playwright.config.ts
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_MAILPIT_API: http://127.0.0.1:8025
          # The hardened backend refuses private webhook targets (that is the SSRF guard working).
          E2E_SKIP_OUTGOING: '1'
      # These two only make sense once the stack was started; if an earlier step failed before that,
      # the env file does not exist and they must not hide the real error.
      - if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/stack.env" ]; then
            docker compose -f packages/deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" logs --tail 200
          fi
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stack.env" ]; then
            docker compose -f packages/deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" --profile dev down -v
          fi
