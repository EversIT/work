# The documentation site with the live demo on the same address: the docs container serves the
# pages and passes /demo/ on to the demo container, so no subdomain and no second certificate
# are needed. Neither needs a database or a backend.
#
#   docker compose -f docker-compose.docs.yml up -d      ->  http://127.0.0.1:8080  and  /demo/
#
# Put your TLS-terminating reverse proxy in front of the docs container only.
services:
  docs:
    image: ${WORK_DOCS_IMAGE:-eversit/work-docs:latest}
    environment:
      DEMO_UPSTREAM: demo:3000
    ports:
      - '${WORK_PUBLISH_ADDR:-127.0.0.1}:${WORK_DOCS_PORT:-8080}:8080'
    depends_on: [demo]
    read_only: true
    tmpfs: ['/tmp', '/etc/nginx/conf.d:uid=101,gid=101', '/var/cache/nginx']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  demo:
    image: ${WORK_DEMO_IMAGE:-eversit/work-demo:latest}
    read_only: true
    tmpfs: [/tmp, /usr/src/app/dist/apps/frontend-demo/cache]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
